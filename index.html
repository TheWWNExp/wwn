<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#540A10" id="themeColor">
<meta name="theme-color" content="#540A10" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#540A10" media="(prefers-color-scheme: light)">
<meta name="description" content="Worship With Nature 2026 · Make room for presence. Free registration · October 10, 2026 · Abuja.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Worship With Nature · Make Room For Presence</title>

<meta property="og:type" content="website">
<meta property="og:title" content="Worship With Nature · 2026">
<meta property="og:description" content="Make room for presence. Free registration · October 10, 2026 · Abuja.">
<meta property="og:image" content="https://lh3.googleusercontent.com/d/1pocy4bEO8WMiCZtSjSOAAfe1uGzSx5j4">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">

<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="image" href="https://lh3.googleusercontent.com/d/1fICvZGOq6nPAwsCqma6WjitZGbDgYAAW">
<link rel="preload" as="image" href="https://lh3.googleusercontent.com/d/1pocy4bEO8WMiCZtSjSOAAfe1uGzSx5j4">

<style>
  :root{
    --brand-top:#540A10;
    --ink-bg:#0B0B0B;
  }
  html{margin:0;padding:0;background:var(--ink-bg);height:100%}
  body{
    margin:0;padding:0;background:var(--ink-bg);
    overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;
    min-height:100vh;min-height:100dvh;position:relative;width:100%;
  }

  /* ---------- TOP CROWN — MOBILE ONLY, HOME ONLY ----------
     Mobile: blends the system bar into the artwork.
     Desktop: never rendered (the app paints the color behind its nav instead).
     Checkout overlay: removed live via postMessage. */
  #topblend{
    display:none;
    position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;
    height:calc(env(safe-area-inset-top, 0px) + 52px);
    background:linear-gradient(180deg,
      var(--brand-top) 0%,
      rgba(84,10,16,.88) 34%,
      rgba(84,10,16,.42) 66%,
      rgba(84,10,16,0) 100%);
  }
  @media (max-width:900px){
    #topblend.on{display:block}
  }

  /* ---------- iframe ---------- */
  #frame{
    position:absolute;inset:0;width:100%;height:100%;border:0;
    background:var(--ink-bg);
    opacity:0;
    transform:scale(1.05);
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    will-change:opacity,transform;
    transition:
      opacity .95s cubic-bezier(.4,0,.2,1) .1s,
      transform 1.2s cubic-bezier(.16,1,.3,1) .1s;
  }
  #frame.on{opacity:1;transform:scale(1)}

  /* ---------- preloader ---------- */
  #splash{
    position:absolute;inset:0;z-index:2;
    background-color:var(--ink-bg);
    background-image:linear-gradient(180deg,
      var(--brand-top) 0%,
      rgba(84,10,16,.6) 12%,
      rgba(11,11,11,0) 38%);
    display:flex;align-items:center;justify-content:center;
    opacity:1;
    transition:opacity .6s cubic-bezier(.4,0,.2,1) .05s;
  }
  #splash.off{opacity:0;pointer-events:none}
  .splash-inner{
    display:flex;flex-direction:column;align-items:center;gap:18px;
    transform:scale(1);opacity:1;
    will-change:transform,opacity;
    transition:
      transform .9s cubic-bezier(.16,1,.3,1),
      opacity .5s ease .05s;
  }
  #splash.off .splash-inner{transform:scale(.86);opacity:0}

  #logoMark{
    height:72px;width:auto;display:block;
    filter:drop-shadow(0 0 22px rgba(238,75,31,.18));
    opacity:0;transform:scale(.92);
    animation:logoIn .9s cubic-bezier(.22,1,.36,1) forwards,
              logoBreath 3s ease-in-out 1s infinite;
  }
  .logo-fallback{
    width:72px;height:72px;border-radius:50%;border:1px solid #EE4B1F;
    display:grid;place-items:center;font:800 .88rem/1 Manrope,sans-serif;
    color:#EE4B1F;letter-spacing:.04em;
  }
  .accent-line{width:32px;height:1px;background:#EE4B1F;opacity:0;
    animation:fadeUp .9s cubic-bezier(.22,1,.36,1) .5s forwards}
  .word{
    font:800 .66rem/1 Manrope,-apple-system,sans-serif;letter-spacing:.3em;
    text-transform:uppercase;color:rgba(243,229,211,.55);opacity:0;
    animation:fadeUp .9s cubic-bezier(.22,1,.36,1) .32s forwards;
  }

  @keyframes logoIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
  @keyframes logoBreath{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.04);opacity:.88}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    #logoMark,.word,.accent-line{opacity:1!important;transform:none!important}
    #splash,.splash-inner{opacity:1!important;transform:none!important}
    #frame{opacity:1!important;transform:none!important}
  }
</style>
</head>
<body>

<div id="splash">
  <div class="splash-inner">
    <img id="logoMark"
         src="https://lh3.googleusercontent.com/d/1fICvZGOq6nPAwsCqma6WjitZGbDgYAAW"
         alt="Worship With Nature"
         onerror="this.outerHTML='<span class=logo-fallback>WWN</span>'">
    <div class="accent-line"></div>
    <span class="word">Make room for presence</span>
  </div>
</div>

<iframe id="frame" title="Worship With Nature"
        allow="camera; microphone; fullscreen; clipboard-write; web-share; geolocation"
        allowfullscreen loading="eager"></iframe>

<div id="topblend" aria-hidden="true"></div>

<script>
  var EXEC = 'https://script.google.com/macros/s/AKfycbwr3kxgUZKxK1DzAoJu9soZ9sNlV7PdpauaAT2mHecZMzOeN2oI7Pi6BGafAoGlBMuq/exec';
  var qs = window.location.search;
  var params = new URLSearchParams(qs);
  var route = (params.get('path') || 'home').toLowerCase();
  var f = document.getElementById('frame');
  var splash = document.getElementById('splash');
  var topblend = document.getElementById('topblend');

  var ROUTE_COLORS = {
    home:     '#540A10',
    register: '#F7F8FA',
    checkout: '#F7F8FA',
    ticket:   '#7A1616',
    admin:    '#0B0B0B',
    checkin:  '#540A10'
  };
  var routeColor = ROUTE_COLORS[route] || ROUTE_COLORS.home;
  var routeAllowsCrown = (route === 'home');

  function setBar(c){
    document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.setAttribute('content', c); });
  }
  setBar(routeColor);
  if (routeAllowsCrown) topblend.classList.add('on');

  f.src = EXEC + (qs || '?path=home');

  f.addEventListener('transitionend', function (e) {
    if (e.propertyName === 'transform') {
      f.style.transform = 'none';
      f.style.willChange = 'auto';
    }
  });

  /* Live coordination with the app inside the iframe */
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || typeof d !== 'object') return;
    if (typeof d.wwnTheme === 'string' && /^#[0-9a-fA-F]{6}$/.test(d.wwnTheme)) {
      setBar(d.wwnTheme);
      document.documentElement.style.setProperty('--brand-top', d.wwnTheme);
      topblend.style.background =
        'linear-gradient(180deg,' + d.wwnTheme + ' 0%, rgba(84,10,16,.88) 34%, rgba(84,10,16,.42) 66%, rgba(84,10,16,0) 100%)';
    }
    if (typeof d.wwnCrown === 'boolean') {
      topblend.classList.toggle('on', d.wwnCrown && routeAllowsCrown);
    }
  });

  var revealed = false;
  function reveal(){
    if (revealed) return;
    revealed = true;
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        f.classList.add('on');
        splash.classList.add('off');
        setTimeout(function(){ splash.style.display = 'none'; }, 1000);
      });
    });
  }
  f.addEventListener('load', function(){ setTimeout(reveal, 500); });
  setTimeout(reveal, 6500);

  var vv = window.visualViewport;
  function fit(){
    var h = vv ? vv.height : window.innerHeight;
    document.body.style.minHeight = h + 'px';
    document.body.style.height = h + 'px';
  }
  fit();
  if (vv){ vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit); }
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', function(){ setTimeout(fit, 120); });
</script>
</body>
</html>
