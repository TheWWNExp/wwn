<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#540A10" id="themeColor">
<meta name="theme-color" content="#540A10" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#540A10" media="(prefers-color-scheme: light)">
<meta name="description" content="Worship With Nature 2026 · Make room for presence. Free registration · October 10, 2026 · Abuja.">
<meta property="og:type" content="website">
<meta property="og:title" content="Worship With Nature · 2026">
<meta property="og:description" content="Make room for presence. Free registration · October 10, 2026 · Abuja.">
<meta property="og:image" content="https://lh3.googleusercontent.com/d/1pocy4bEO8WMiCZtSjSOAAfe1uGzSx5j4">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="image" href="https://lh3.googleusercontent.com/d/1fICvZGOq6nPAwsCqma6WjitZGbDgYAAW">
<link rel="preload" as="image" href="https://lh3.googleusercontent.com/d/1pocy4bEO8WMiCZtSjSOAAfe1uGzSx5j4">
<style>
  :root{ --brand-top:#540A10; --ink-bg:#0B0B0B; }
  html{margin:0;padding:0;background:var(--ink-bg);height:100%}
  body{margin:0;padding:0;background:var(--ink-bg);overscroll-behavior-y:contain;
    -webkit-overflow-scrolling:touch;min-height:100vh;min-height:100dvh;position:relative;width:100%}

  /* ---- status-bar strip (mobile): solid brand color, blends into the in-app wash ---- */
  #topblend{display:none;position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;
    height:calc(env(safe-area-inset-top, 0px) + 10px);
    background:linear-gradient(180deg,var(--brand-top) 0%,var(--brand-top) 55%,rgba(84,10,16,.82) 100%)}
  @media (max-width:900px){ #topblend.on{display:block} }

  /* ---- CINEMATIC FRAME: settles from zoom+blur into crisp full-frame ---- */
  #frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--ink-bg);
    opacity:0;transform:scale(1.06);filter:blur(12px);
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    will-change:opacity,transform,filter;
    transition:opacity .55s ease .08s,
               transform 1s cubic-bezier(.16,1,.3,1) .08s,
               filter 1s cubic-bezier(.16,1,.3,1) .08s}
  #frame.on{opacity:1;transform:scale(1);filter:blur(0)}

  /* ---- preloader: mark expands THROUGH the camera ---- */
  #splash{position:absolute;inset:0;z-index:2;background-color:var(--ink-bg);
    background-image:linear-gradient(180deg,var(--brand-top) 0%,rgba(84,10,16,.6) 12%,rgba(11,11,11,0) 38%);
    display:flex;align-items:center;justify-content:center;opacity:1;
    transition:opacity .65s ease .05s;cursor:pointer}
  #splash.off{opacity:0;pointer-events:none}
  .splash-inner{display:flex;flex-direction:column;align-items:center;gap:18px;
    will-change:transform,opacity;
    transition:transform .75s cubic-bezier(.55,0,.55,.2), opacity .55s ease}
  #splash.off .splash-inner{transform:scale(1.5);opacity:0}
  #logoMark{height:72px;width:auto;display:block;
    filter:drop-shadow(0 0 22px rgba(238,75,31,.18));
    opacity:0;transform:scale(.92);
    animation:logoIn .9s cubic-bezier(.22,1,.36,1) forwards,
              logoBreath 3s ease-in-out 1s infinite}
  .logo-fallback{width:72px;height:72px;border-radius:50%;border:1px solid #EE4B1F;
    display:grid;place-items:center;font:800 .88rem/1 Manrope,sans-serif;color:#EE4B1F;letter-spacing:.04em}
  .accent-line{width:32px;height:1px;background:#EE4B1F;opacity:0;
    animation:fadeUp .9s cubic-bezier(.22,1,.36,1) .5s forwards}
  .word{font:800 .66rem/1 Manrope,-apple-system,sans-serif;letter-spacing:.3em;
    text-transform:uppercase;color:rgba(243,229,211,.55);opacity:0;
    animation:fadeUp .9s cubic-bezier(.22,1,.36,1) .32s forwards}
  @keyframes logoIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
  @keyframes logoBreath{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.04);opacity:.88}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    #logoMark,.word,.accent-line{opacity:1!important;transform:none!important}
    #splash,.splash-inner{opacity:1!important;transform:none!important}
    #frame{opacity:1!important;transform:none!important;filter:none!important}
  }
</style>
</head>
<body>

<div id="splash">
  <div class="splash-inner">
    <img id="logoMark" src="https://lh3.googleusercontent.com/d/1fICvZGOq6nPAwsCqma6WjitZGbDgYAAW"
         alt="Worship With Nature"
         onerror="this.outerHTML='<span class=logo-fallback>WWN</span>'">
    <div class="accent-line"></div>
    <span class="word">Make room for presence</span>
  </div>
</div>

<iframe id="frame" title="Worship With Nature"
        allow="autoplay; camera; microphone; fullscreen; clipboard-write; web-share; geolocation"
        allowfullscreen loading="eager"></iframe>

<div id="topblend" aria-hidden="true"></div>

<script>
  var EXEC = 'https://script.google.com/macros/s/AKfycbwr3kxgUZKxK1DzAoJu9soZ9sNlV7PdpauaAT2mHecZMzOeN2oI7Pi6BGafAoGlBMuq/exec';
  var qs = window.location.search;
  var route = (new URLSearchParams(qs).get('path') || 'home').toLowerCase();
  var f = document.getElementById('frame');
  var splash = document.getElementById('splash');
  var topblend = document.getElementById('topblend');

  var ROUTE_COLORS = { home:'#540A10', register:'#F7F8FA', checkout:'#F7F8FA',
                       ticket:'#7A1616', admin:'#0B0B0B', checkin:'#540A10' };
  var routeColor = ROUTE_COLORS[route] || ROUTE_COLORS.home;
  var routeAllowsCrown = (route === 'home');

  function setBar(c){
    document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.setAttribute('content', c); });
  }
  function paintStrip(c){
    document.documentElement.style.setProperty('--brand-top', c);
    topblend.style.background = 'linear-gradient(180deg,' + c + ' 0%,' + c + ' 55%, rgba(84,10,16,.82) 100%)';
  }
  setBar(routeColor);
  paintStrip(routeColor);
  if (routeAllowsCrown) topblend.classList.add('on');

  f.src = EXEC + (qs || '?path=home');

  /* ---- reveal: cinematic zoom-out, every load, tap-to-skip ---- */
  var revealed = false;
  function reveal(){
    if (revealed) return;
    revealed = true;
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      f.classList.add('on');
      splash.classList.add('off');
      setTimeout(function(){ splash.style.display = 'none'; }, 950);
    });});
  }
  splash.addEventListener('click', reveal);
  document.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') reveal(); });
  f.addEventListener('load', function(){ setTimeout(reveal, 450); });
  setTimeout(reveal, 6500);

  f.addEventListener('transitionend', function (e) {
    if (e.propertyName === 'transform') { f.style.transform = 'none'; f.style.willChange = 'auto'; }
  });

  /* ---- live coordination from any nesting depth inside the iframe ---- */
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || typeof d !== 'object') return;
    if (typeof d.wwnTheme === 'string' && /^#[0-9a-fA-F]{6}$/.test(d.wwnTheme)) {
      setBar(d.wwnTheme);
      paintStrip(d.wwnTheme);
    }
    if (typeof d.wwnCrown === 'boolean') {
      topblend.classList.toggle('on', d.wwnCrown && routeAllowsCrown);
    }
  });

  var vv = window.visualViewport;
  function fit(){
    var h = vv ? vv.height : window.innerHeight;
    document.body.style.minHeight = h + 'px';
    document.body.style.height = h + 'px';
  }
  fit();
  if (vv){ vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit); }
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', function(){ setTimeout(fit, 120); });
</script>
</body>
</html>
