<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0B">
<meta name="description" content="Worship With Nature 2026 · Make room for presence. Free registration · October 10, 2026 · Abuja.">

<meta property="og:type" content="website">
<meta property="og:title" content="Worship With Nature · 2026">

<link rel="preconnect" href="https://script.google.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="image" href="https://lh3.googleusercontent.com/d/1fICvZGOq6nPAwsCqma6WjitZGbDgYAAW">
<link rel="preload" as="image" href="https://lh3.googleusercontent.com/d/1pocy4bEO8WMiCZtSjSOAAfe1uGzSx5j4">

<style>
  html,body{margin:0;padding:0;height:100%;background:#0B0B0B;overscroll-behavior:none}
  body{position:fixed;inset:0;width:100%}

  /* ---------- iframe ---------- */
  #frame{
    position:absolute;inset:0;width:100%;height:100%;border:0;background:#0B0B0B;
    opacity:0;will-change:opacity,transform;
    transform:scale(0.96);
    transition:opacity .6s cubic-bezier(.16,1,.3,1), transform .7s cubic-bezier(.16,1,.3,1);
  }
  #frame.on{
    opacity:1;
    transform:scale(1);
  }

  /* ---------- preloader ---------- */
  #splash{
    position:absolute;inset:0;z-index:2;background:#0B0B0B;
    display:flex;align-items:center;justify-content:center;
    opacity:1;transform:scale(1);
    will-change:opacity,transform;
    transition:opacity .5s ease .1s, transform .6s cubic-bezier(.16,1,.3,1) .1s;
  }
  #splash.off{
    opacity:0;
    transform:scale(0.85);
    pointer-events:none;
  }

  .splash-inner{
    display:flex;flex-direction:column;align-items:center;gap:18px;
    transform:scale(1);opacity:1;
    transition:transform .5s cubic-bezier(.16,1,.3,1), opacity .4s ease;
  }
  #splash.off .splash-inner{
    transform:scale(0.78);
    opacity:0;
  }

  #logoMark{
    height:72px;width:auto;display:block;
    filter:drop-shadow(0 0 22px rgba(238,75,31,.18));
    opacity:0;transform:scale(.92);
    animation:logoIn .8s cubic-bezier(.22,1,.36,1) forwards,
              logoBreath 2.6s ease-in-out .9s infinite;
  }
  .logo-fallback{
    width:72px;height:72px;border-radius:50%;border:1px solid #EE4B1F;
    display:grid;place-items:center;font:800 .88rem/1 Manrope,sans-serif;
    color:#EE4B1F;letter-spacing:.04em;
  }
  .accent-line{
    width:32px;height:1px;background:#EE4B1F;opacity:0;
    animation:fadeUp .8s cubic-bezier(.22,1,.36,1) .45s forwards;
  }
  .word{
    font:800 .66rem/1 Manrope,-apple-system,sans-serif;letter-spacing:.3em;
    text-transform:uppercase;color:rgba(243,229,211,.55);opacity:0;
    animation:fadeUp .8s cubic-bezier(.22,1,.36,1) .28s forwards;
  }

  @keyframes logoIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
  @keyframes logoBreath{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.04);opacity:.88}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    #logoMark,.word,.accent-line{opacity:1!important;transform:none!important}
    #splash,.splash-inner,#frame{opacity:1!important;transform:none!important}
  }
</style>
</head>
<body>

<div id="splash">
  <div class="splash-inner">
    <img id="logoMark"
         src="https://lh3.googleusercontent.com/d/1fICvZGOq6nPAwsCqma6WjitZGbDgYAAW"
         alt="Worship With Nature"
         onerror="this.outerHTML='<span class=logo-fallback>WWN</span>'">
    <div class="accent-line"></div>
    <span class="word">Make room for presence</span>
  </div>
</div>

<iframe id="frame" title="Worship With Nature"
        allow="camera; microphone; fullscreen; clipboard-write; web-share; geolocation"
        allowfullscreen loading="eager"></iframe>

<script>
  var EXEC = 'https://script.google.com/macros/s/AKfycbwr3kxgUZKxK1DzAoJu9soZ9sNlV7PdpauaAT2mHecZMzOeN2oI7Pi6BGafAoGlBMuq/exec';
  var qs = window.location.search;
  var f = document.getElementById('frame');
  var splash = document.getElementById('splash');
  f.src = EXEC + (qs || '?path=home');

  /* Reveal: same timing and animation on desktop and mobile */
  var revealed = false;
  function reveal(){
    if (revealed) return;
    revealed = true;
    /* Force layout before adding classes (prevents skipped animations) */
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        f.classList.add('on');
        splash.classList.add('off');
        setTimeout(function(){ splash.style.display = 'none'; }, 800);
      });
    });
  }
  f.addEventListener('load', function(){ setTimeout(reveal, 450); });
  setTimeout(reveal, 6500);

  /* Lock shell viewport to the true visible height */
  var vv = window.visualViewport;
  function fit(){ document.body.style.height = (vv ? vv.height : window.innerHeight) + 'px'; }
  fit();
  if (vv){ vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit); }
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', function(){ setTimeout(fit, 120); });
</script>
</body>
</html>
