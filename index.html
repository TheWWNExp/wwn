<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0B">
<meta name="description" content="Worship With Nature 2026 · Make room for presence. Free registration · October 10, 2026 · Abuja.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Worship With Nature · Make Room For Presence</title>

<!-- Rich link previews (WhatsApp / iMessage / Telegram) -->
<meta property="og:type" content="website">
<meta property="og:title" content="Worship With Nature · 2026">
<meta property="og:description" content="Make room for presence. Free registration · October 10, 2026 · Abuja.">
<meta property="og:image" content="https://lh3.googleusercontent.com/d/1pocy4bEO8WMiCZtSjSOAAfe1uGzSx5j4">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">

<!-- Speed: warm the connections before the app needs them -->
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Speed: fetch the logo and mobile hero while the splash is showing -->
<link rel="preload" as="image" href="https://lh3.googleusercontent.com/d/1fICvZGOq6nPAwsCqma6WjitZGbDgYAAW">
<link rel="preload" as="image" href="https://lh3.googleusercontent.com/d/1pocy4bEO8WMiCZtSjSOAAfe1uGzSx5j4">

<style>
  html,body{margin:0;padding:0;height:100%;background:#0B0B0B;overscroll-behavior:none}
  body{position:fixed;inset:0;width:100%}

  /* ---- Splash / preloader with zoom-out reveal ---- */
  #splash{
    position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;background:#0B0B0B;
    color:#F3E5D3;font-family:Manrope,-apple-system,BlinkMacSystemFont,sans-serif;
    transform:scale(1.08);
    transition:opacity .55s cubic-bezier(.22,1,.36,1), transform .6s cubic-bezier(.22,1,.36,1);
  }
  #splash.off{
    opacity:0;
    transform:scale(1);
    pointer-events:none;
  }

  /* Logo image in splash */
  #logoMark{
    height:72px;width:auto;display:block;
    filter:drop-shadow(0 0 22px rgba(238,75,31,.18));
    opacity:0;transform:scale(.92);
    animation:logoIn .8s cubic-bezier(.22,1,.36,1) forwards, logoBreath 2.6s ease-in-out .8s infinite;
  }
  .logo-fallback{
    width:72px;height:72px;border-radius:50%;border:1px solid #EE4B1F;
    display:grid;place-items:center;font:800 .88rem/1 Manrope,sans-serif;
    color:#EE4B1F;letter-spacing:.04em;
  }

  .word{
    font:800 .66rem/1 Manrope,sans-serif;letter-spacing:.3em;
    text-transform:uppercase;color:rgba(243,229,211,.55);
    opacity:0;animation:fadeUp .8s cubic-bezier(.22,1,.36,1) .3s forwards;
  }

  .accent-line{
    width:32px;height:1px;background:#EE4B1F;opacity:0;
    animation:fadeUp .8s cubic-bezier(.22,1,.36,1) .5s forwards;
  }

  /* ---- iframe with zoom-in reveal ---- */
  #frame{
    position:absolute;inset:0;width:100%;height:100%;border:0;background:#0B0B0B;
    opacity:0;
    transform:scale(0.96);
    transition:opacity .5s ease .1s, transform .6s cubic-bezier(.22,1,.36,1) .1s;
  }
  #frame.on{
    opacity:1;
    transform:scale(1);
  }

  @keyframes logoIn{
    from{opacity:0;transform:scale(.92)}
    to{opacity:1;transform:scale(1)}
  }
  @keyframes logoBreath{
    0%,100%{transform:scale(1);opacity:1}
    50%{transform:scale(1.04);opacity:.88}
  }
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(8px)}
    to{opacity:1;transform:translateY(0)}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    #logoMark,.word,.accent-line,#frame,#splash{opacity:1!important;transform:none!important}
    #splash{transform:scale(1)!important}
  }
</style>
</head>
<body>
<div id="splash">
  <img id="logoMark"
       src="https://lh3.googleusercontent.com/d/1fICvZGOq6nPAwsCqma6WjitZGbDgYAAW"
       alt="Worship With Nature"
       onerror="this.outerHTML='<span class=logo-fallback>WWN</span>'">
  <div class="accent-line"></div>
  <span class="word">Make room for presence</span>
</div>

<iframe id="frame" title="Worship With Nature"
        allow="camera; microphone; fullscreen; clipboard-write; web-share; geolocation"
        allowfullscreen loading="eager"></iframe>

<script>
  var EXEC = 'https://script.google.com/macros/s/AKfycbwr3kxgUZKxK1DzAoJu9soZ9sNlV7PdpauaAT2mHecZMzOeN2oI7Pi6BGafAoGlBMuq/exec';
  var qs = window.location.search;
  var f = document.getElementById('frame');
  f.src = EXEC + (qs || '?path=home');

  function ready(){
    f.classList.add('on');
    document.getElementById('splash').classList.add('off');
  }
  f.addEventListener('load', ready);
  setTimeout(ready, 6000);

  var vv = window.visualViewport;
  function fit(){
    document.body.style.height = (vv ? vv.height : window.innerHeight) + 'px';
  }
  fit();
  if (vv){
    vv.addEventListener('resize', fit);
    vv.addEventListener('scroll', fit);
  }
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', function(){ setTimeout(fit, 120); });
</script>
</body>
</html>
