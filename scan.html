<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0B">
<title>WWN · Camera</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300..800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{--ink:#0B0B0B;--cream:#F3E5D3;--dim:rgba(243,229,211,.65);--orange:#EE4B1F;--fb:'Manrope',-apple-system,sans-serif}
  *{box-sizing:border-box}[hidden]{display:none!important}
  html,body{margin:0;background:var(--ink);color:var(--cream);font-family:var(--fb);min-height:100dvh}
  .wrap{max-width:560px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 18px 40px;
    display:flex;flex-direction:column;gap:18px;min-height:100dvh}
  .eyebrow{font:700 .7rem/1 var(--fb);letter-spacing:.34em;text-transform:uppercase;color:var(--orange);margin:0;text-align:center}
  h1{margin:0;text-align:center;font:800 clamp(2.2rem,9vw,3.2rem)/1.02 var(--fb);letter-spacing:-.02em;color:#fff}
  h1 em{font-style:normal;color:var(--orange)}
  .lede{margin:0 auto;max-width:34ch;text-align:center;font:400 .95rem/1.6 var(--fb);color:var(--dim)}
  .cam{background:#111;border:1px solid #1F1F1F;border-radius:18px;overflow:hidden;position:relative}
  #reader{width:100%;background:#000;min-height:300px}
  #reader video{object-fit:cover!important}
  #reader__dashboard_section_csr button,#reader__dashboard_section_swapoff{display:none!important}
  #reader__dashboard,#reader__dashboard_section{padding:0!important}
  #reader__status_span,#reader__header_message{display:none!important}
  .frame{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(70%,300px);aspect-ratio:1;pointer-events:none;z-index:3}
  .frame i{position:absolute;width:26px;height:26px;border:3px solid var(--orange)}
  .frame i.tl{top:0;left:0;border-right:0;border-bottom:0;border-top-left-radius:12px}
  .frame i.tr{top:0;right:0;border-left:0;border-bottom:0;border-top-right-radius:12px}
  .frame i.bl{bottom:0;left:0;border-right:0;border-top:0;border-bottom-left-radius:12px}
  .frame i.br{bottom:0;right:0;border-left:0;border-top:0;border-bottom-right-radius:12px}
  .hint{padding:14px 18px;margin:0;text-align:center;font:400 .88rem/1.5 var(--fb);color:var(--dim)}
  .actions{display:flex;gap:10px;padding:0 18px 18px}
  .btn{flex:1;border:0;border-radius:12px;padding:16px;font:800 .9rem/1 var(--fb);cursor:pointer;touch-action:manipulation}
  .primary{background:var(--orange);color:#fff}
  .ghost{background:#1A1A1A;color:var(--cream);border:1px solid #262626}
  .alt{text-align:center;font:600 .8rem/1.5 var(--fb);color:var(--dim);text-decoration:none;letter-spacing:.06em}
  .alt:hover{color:var(--cream)}
</style>
</head>
<body>
<main class="wrap">
  <p class="eyebrow">WWN · Event Day</p>
  <h1>Point.<br><em>Scan.</em><br>Welcome.</h1>
  <p class="lede">Your browser will ask for camera permission on this page. Allow it once — then scanning is hands-free.</p>
  <div class="cam">
    <div id="reader"></div>
    <div class="frame" id="frame" hidden><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i></div>
    <p class="hint" id="hint">Starting camera…</p>
    <div class="actions">
      <button class="btn primary" id="start" type="button">Start camera</button>
      <button class="btn ghost" id="stop" type="button" hidden>Stop</button>
    </div>
  </div>
  <a class="alt" id="terminal" href="#">Or open the check-in terminal</a>
</main>
<script>
(function () {
  'use strict';
  var EXEC = 'https://script.google.com/macros/s/AKfycbyiF5Umx_LlTxCU2FJy55r91ykLAh-FWPRWAxVacgY9BLS4dY1gx8SXmchhkNBdVT5_/exec';
  var K = '';
  try { K = new URLSearchParams(window.location.search).get('k') || ''; } catch (e) {}
  document.getElementById('terminal').href = EXEC + '?path=checkin&k=' + encodeURIComponent(K);

  var hint = document.getElementById('hint');
  var frame = document.getElementById('frame');
  var startB = document.getElementById('start');
  var stopB = document.getElementById('stop');

  var qr = null, on = false, last = 0, handing = false;

  function handoff(token){
    if (handing) return;
    handing = true;
    hint.textContent = 'Pass read — opening check-in…';
    window.location.href = EXEC + '?path=checkin&k=' + encodeURIComponent(K) + '&scan=' + encodeURIComponent(token);
  }
  function got(txt){
    var now = Date.now();
    if (now - last < 2000) return;
    last = now;
    var t = String(txt || '').trim();
    if (!t) return;
    if (qr && on) qr.stop().then(function(){ handoff(t); }).catch(function(){ handoff(t); });
    else handoff(t);
  }
  function start(){
    if (on || handing) return;
    if (!K) { hint.innerHTML = '<span style="color:#F97B4F">Missing staff key. Open this page from your staff link: scan.html?k=YOUR_KEY</span>'; return; }
    if (typeof Html5Qrcode === 'undefined') { hint.innerHTML = '<span style="color:#F97B4F">Scanner library failed to load. Check your connection.</span>'; return; }
    startB.disabled = true;
    hint.textContent = 'Requesting camera…';
    if (!qr) qr = new Html5Qrcode('reader', { verbose: false });
    Html5Qrcode.getCameras().then(function (cams) {
      if (!cams || !cams.length) { hint.textContent = 'No camera found on this device.'; startB.disabled = false; return null; }
      var rear = null;
      for (var i = 0; i < cams.length; i++) {
        var l = (cams[i].label || '').toLowerCase();
        if (l.indexOf('back') !== -1 || l.indexOf('rear') !== -1 || l.indexOf('environment') !== -1) { rear = cams[i]; break; }
      }
      return qr.start(rear ? rear.id : cams[cams.length - 1].id,
        { fps: 12, qrbox: { width: 250, height: 250 } }, got, function () {});
    }).then(function (s) {
      if (s === null) return;
      on = true; startB.hidden = true; stopB.hidden = false; frame.hidden = false;
      hint.textContent = 'Hold the QR inside the frame.';
    }).catch(function (err) {
      var msg = String(err && err.message ? err.message : err);
      hint.innerHTML = '<span style="color:#F97B4F">Camera blocked: ' + msg + '. Allow camera for this site in browser settings, then tap Start camera.</span>';
      startB.disabled = false;
    });
  }
  function stop(){
    if (!on || !qr) return;
    qr.stop().then(function(){
      on = false; startB.hidden = false; stopB.hidden = true; frame.hidden = true;
      startB.disabled = false; hint.textContent = 'Camera paused.';
    }).catch(function(){});
  }
  startB.addEventListener('click', start);
  stopB.addEventListener('click', stop);

  /* Ask for permission as early as the platform allows (top-level page = real prompt) */
  window.addEventListener('load', function(){ if (K) setTimeout(start, 250); });
})();
</script>
</body>
</html>
