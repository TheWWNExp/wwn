<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0B0B0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>WWN · Event Day</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300..800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --ink:#0B0B0B;--cream:#F3E5D3;--dim:rgba(243,229,211,.62);
    --orange:#EE4B1F;--orange-light:#F97B4F;
    --ok:#4FD38F;--warn:#E8C46A;--err:#F28B7E;
    --fb:'Manrope',-apple-system,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
  body{background:var(--ink);color:var(--cream);font-family:var(--fb);-webkit-text-size-adjust:100%}
  ::selection{background:var(--orange);color:#fff}

  .app{height:100vh;height:100dvh;display:flex;flex-direction:column;
    padding:calc(12px + env(safe-area-inset-top)) 14px calc(10px + env(safe-area-inset-bottom));
    gap:10px;max-width:640px;margin:0 auto}

  .head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex:none}
  .logo{height:34px;width:auto;max-width:150px;object-fit:contain;display:block}
  .logo-fb{height:34px;display:flex;align-items:center;font:800 1.05rem/1 var(--fb);
    letter-spacing:-.01em;color:var(--cream)}
  .logout{background:transparent;border:1px solid rgba(243,229,211,.22);color:var(--dim);
    padding:9px 15px;border-radius:999px;font:700 .66rem/1 var(--fb);letter-spacing:.16em;
    text-transform:uppercase;cursor:pointer;transition:all .2s}
  .logout:hover{border-color:var(--orange);color:var(--orange)}

  .title{flex:none;text-align:center}
  .title .eyebrow{font:700 .62rem/1 var(--fb);letter-spacing:.34em;text-transform:uppercase;
    color:var(--orange);margin:0 0 4px}
  .title h1{margin:0;font:800 clamp(1.5rem,6.4vh,2.5rem)/1.04 var(--fb);letter-spacing:-.02em;color:#fff}
  .title h1 em{font-style:normal;color:var(--orange)}
  @media (max-height:640px){ .title h1{font-size:1.35rem} .title .eyebrow{display:none} }

  .stage{flex:1;min-height:0;position:relative;border-radius:20px;overflow:hidden;
    background:#000;border:1px solid #1C1C1C}
  #reader{position:absolute;inset:0}
  #reader video{width:100%!important;height:100%!important;object-fit:cover!important}
  #reader__dashboard,#reader__dashboard_section,#reader__status_span,#reader__header_message,
  #reader__dashboard_section_csr,#reader__dashboard_section_swapoff{display:none!important}
  [id*="qrbox"],#reader__scan_region__qrbox{border:none!important;box-shadow:none!important;background:transparent!important}
  #reader__scan_region{border:none!important}

  .frame{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(64%,260px);aspect-ratio:1;pointer-events:none;z-index:3;
    transition:opacity .3s ease}
  .frame.hold{opacity:.25}
  .frame i{position:absolute;width:26px;height:26px;border:3px solid var(--orange)}
  .frame i.tl{top:0;left:0;border-right:0;border-bottom:0;border-top-left-radius:12px}
  .frame i.tr{top:0;right:0;border-left:0;border-bottom:0;border-top-right-radius:12px}
  .frame i.bl{bottom:0;left:0;border-right:0;border-top:0;border-bottom-left-radius:12px}
  .frame i.br{bottom:0;right:0;border-left:0;border-top:0;border-bottom-right-radius:12px}
  .frame .beam{position:absolute;left:8%;right:8%;top:50%;height:2px;
    background:linear-gradient(90deg,transparent,var(--orange-light),transparent);
    animation:beam 2.6s ease-in-out infinite}
  .frame.hold .beam{display:none}
  @keyframes beam{0%,100%{transform:translateY(-90px);opacity:0}
    15%{opacity:.9}50%{transform:translateY(0)}85%{opacity:.9}
    100%{transform:translateY(90px);opacity:0}}

  .statusbar{position:absolute;left:0;right:0;bottom:0;z-index:4;
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:26px 14px 12px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.82))}
  .live{display:inline-flex;align-items:center;gap:7px;font:700 .64rem/1 var(--fb);
    letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
  .live .dot{width:7px;height:7px;border-radius:50%;background:#555}
  .live.on{color:var(--ok)} .live.on .dot{background:var(--ok);animation:pulse 1.4s ease-in-out infinite}
  .live.hold{color:var(--warn)} .live.hold .dot{background:var(--warn)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .kb{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:var(--dim);
    width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:.95rem;
    display:grid;place-items:center;transition:all .2s}
  .kb:hover{color:#fff;border-color:rgba(255,255,255,.3)}

  .camover{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;background:rgba(8,8,8,.86);
    backdrop-filter:blur(4px);text-align:center;padding:20px}
  .camover p{margin:0;max-width:30ch;font:400 .88rem/1.55 var(--fb);color:var(--dim)}
  .camover .btn{width:min(260px,80%)}

  .manual{flex:none;display:flex;gap:8px}
  .manual input{flex:1;min-width:0;padding:13px 14px;border:1px solid #262626;border-radius:12px;
    background:#111;color:#fff;font:600 .95rem/1 var(--fb);letter-spacing:.08em;text-transform:uppercase}
  .manual input:focus{outline:none;border-color:var(--orange)}
  .manual input::placeholder{color:rgba(243,229,211,.3);letter-spacing:.03em;text-transform:none}
  .manual button{flex:none;padding:0 18px;border:0;border-radius:12px;background:var(--orange);
    color:#fff;font:800 .8rem/1 var(--fb);cursor:pointer}

  .btn{border:0;border-radius:12px;padding:15px 20px;font:800 .88rem/1 var(--fb);
    letter-spacing:.04em;cursor:pointer;transition:transform .15s,background .2s}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--orange);color:#fff}
  .btn.primary:hover{background:var(--orange-light)}

  .modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
    padding:16px;background:rgba(4,4,4,.74);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
  .sheet{width:min(430px,100%);max-height:88vh;max-height:88dvh;overflow-y:auto;
    background:#101010;border:1px solid #242424;border-radius:22px;padding:24px 20px 20px;
    animation:sheetIn .32s cubic-bezier(.22,1,.36,1) both;text-align:center}
  @keyframes sheetIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
  .sheet .ico{width:64px;height:64px;border-radius:50%;margin:0 auto 12px;
    display:grid;place-items:center;font-size:1.7rem;font-weight:800}
  .sheet.s-ok .ico{background:rgba(31,122,77,.22);color:var(--ok)}
  .sheet.s-already .ico{background:rgba(184,134,11,.22);color:var(--warn)}
  .sheet.s-err .ico{background:rgba(176,58,46,.22);color:var(--err)}
  .sheet.s-load .ico{background:rgba(243,229,211,.08);color:var(--dim);animation:pulse 1.2s ease-in-out infinite}
  .sheet h2{margin:0 0 4px;font:800 clamp(1.3rem,5vw,1.7rem)/1.1 var(--fb);
    letter-spacing:-.01em;color:#fff;text-transform:uppercase}
  .badge{display:inline-block;padding:5px 11px;border-radius:999px;margin:8px 0 4px;
    background:rgba(238,75,31,.16);color:var(--orange-light);
    font:800 .6rem/1 var(--fb);letter-spacing:.22em;text-transform:uppercase}
  .pname{font:800 1.35rem/1.2 var(--fb);color:#fff;margin:8px 0 2px}
  .psub{font:400 .86rem/1.5 var(--fb);color:var(--dim);margin:4px 0 0}

  .party{background:rgba(243,229,211,.045);border:1px solid rgba(243,229,211,.1);
    border-radius:14px;padding:12px 14px;margin:14px 0 4px;text-align:left}
  .party-head{display:flex;justify-content:space-between;align-items:center;
    padding-bottom:8px;margin-bottom:6px;border-bottom:1px dashed rgba(243,229,211,.14)}
  .party-head .k{font:700 .6rem/1 var(--fb);letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
  .party-head .n{font:800 .9rem/1 var(--fb);color:#fff}
  .pm{display:flex;align-items:baseline;gap:8px;padding:7px 0;font:500 .88rem/1.35 var(--fb)}
  .pm + .pm{border-top:1px solid rgba(243,229,211,.06)}
  .pm .nm{flex:1;min-width:0;color:#fff;font-weight:700}
  .pm .nm .age{color:var(--dim);font-weight:500;font-size:.76rem;margin-left:4px}
  .pm .rl{flex:none;font:700 .58rem/1 var(--fb);letter-spacing:.18em;text-transform:uppercase}
  .pm .rl.primary{color:var(--orange-light)} .pm .rl.partner{color:#7EC8E3} .pm .rl.child{color:var(--warn)}
  .pm .st{flex:none;font:700 .76rem/1 var(--fb);color:var(--cream);font-variant-numeric:tabular-nums}

  .meta{margin:12px 0 0;text-align:left}
  .meta .row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;
    font:500 .82rem/1.4 var(--fb);border-top:1px solid rgba(243,229,211,.07)}
  .meta .k{color:var(--dim);letter-spacing:.16em;text-transform:uppercase;font-size:.62rem;font-weight:700;padding-top:2px}
  .meta .v{color:#fff;font-weight:800;letter-spacing:.04em;text-align:right}
  .sheet .btn{width:100%;margin-top:16px}

  @media (prefers-reduced-motion:reduce){
    .sheet,.frame .beam,.live.on .dot,.sheet.s-load .ico{animation:none!important}
  }
</style>
</head>
<body>
<div class="app">

  <div class="head">
    <div id="logoWrap"></div>
    <button class="logout" id="logoutBtn">Log out</button>
  </div>

  <div class="title">
    <p class="eyebrow">WWN · Event Day</p>
    <h1>Point. <em>Scan.</em><br>Welcome.</h1>
  </div>

  <div class="stage">
    <div id="reader"></div>
    <div class="frame" id="frame"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i><div class="beam"></div></div>
    <div class="statusbar">
      <span class="live" id="liveTag"><span class="dot"></span><span id="liveTxt">Camera off</span></span>
      <button class="kb" id="kbBtn" title="Type a ticket number" aria-label="Type a ticket number">⌨</button>
    </div>
    <div class="camover" id="camOver">
      <p id="camMsg">Allow the camera once — then scanning stays live until you log out.</p>
      <button class="btn primary" id="startBtn">Start camera</button>
    </div>
  </div>

  <div class="manual" id="manualRow" hidden>
    <input id="manualId" type="text" inputmode="text" autocapitalize="characters"
           placeholder="WWN26-XXXXXXXX" spellcheck="false" autocomplete="off">
    <button id="manualGo" type="button">Check in</button>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<script>
(function () {
  'use strict';

  var EXEC = 'https://script.google.com/macros/s/AKfycbyiF5Umx_LlTxCU2FJy55r91ykLAh-FWPRWAxVacgY9BLS4dY1gx8SXmchhkNBdVT5_/exec';
  var staffKey = '';

  var logoWrap = document.getElementById('logoWrap');
  var logoutBtn = document.getElementById('logoutBtn');
  var frame = document.getElementById('frame');
  var liveTag = document.getElementById('liveTag');
  var liveTxt = document.getElementById('liveTxt');
  var camOver = document.getElementById('camOver');
  var camMsg = document.getElementById('camMsg');
  var startBtn = document.getElementById('startBtn');
  var kbBtn = document.getElementById('kbBtn');
  var manualRow = document.getElementById('manualRow');
  var manualId = document.getElementById('manualId');
  var manualGo = document.getElementById('manualGo');
  var modal = document.getElementById('modal');
  var sheet = document.getElementById('sheet');

  var qr = null, running = false, holding = false, modalOpen = false;
  var lastToken = '', lastTokenAt = 0, cooldownUntil = 0;

  logoWrap.innerHTML = '<div class="logo-fb">WWN</div>';

  (function boot(){ showLoginGate(); })();

  function showLoginGate(){
    camOver.hidden = false;
    camMsg.innerHTML = 'Enter your staff key to unlock the scanner.';
    camMsg.innerHTML += '<div style="margin-top:12px"><input id="gateKey" type="password" placeholder="Staff key" ' +
      'style="width:min(260px,80%);padding:14px;border:1px solid #2A2A2A;border-radius:12px;background:#111;' +
      'color:#fff;font:600 .95rem/1 Manrope,sans-serif;letter-spacing:.1em;text-align:center" autocomplete="off"></div>';
    startBtn.textContent = 'Unlock scanner';
    startBtn.onclick = attemptLogin;
    setTimeout(function(){ var g = document.getElementById('gateKey'); if (g) g.focus(); }, 60);
  }

  function attemptLogin(){
    var g = document.getElementById('gateKey');
    var k = g ? g.value.trim() : '';
    if (!k) { flashGate('Please enter your staff key.'); return; }
    startBtn.disabled = true;
    startBtn.textContent = 'Validating…';
    api({ action: 'validateKey', adminKey: k }).then(function (res) {
      if (res && res.valid) {
        staffKey = k;
        loadConfigThenCamera();
      } else {
        startBtn.disabled = false;
        startBtn.textContent = 'Unlock scanner';
        flashGate('Invalid staff key. Try again.');
        if (g) g.select();
      }
    }).catch(function () {
      startBtn.disabled = false;
      startBtn.textContent = 'Unlock scanner';
      flashGate('Connection issue. Try again.');
    });
  }
  function flashGate(msg){
    var old = document.getElementById('gateErr');
    if (old) old.remove();
    var d = document.createElement('div');
    d.id = 'gateErr';
    d.style.cssText = 'color:var(--orange);font:600 .8rem/1.4 Manrope,sans-serif;margin-top:10px';
    d.textContent = msg;
    camMsg.parentNode.insertBefore(d, startBtn);
  }

  function loadConfigThenCamera(){
    api({ action: 'getPublicConfig', adminKey: staffKey }).then(function (cfg) {
      if (cfg && cfg.logoUrl) {
        var img = new Image();
        img.onload = function(){ img.className = 'logo'; img.alt = 'WWN'; logoWrap.innerHTML = ''; logoWrap.appendChild(img); };
        img.src = cfg.logoUrl;
      }
      enterScanner();
    }).catch(enterScanner);
  }

  function enterScanner(){
    camMsg.textContent = 'Allow the camera once — then scanning stays live until you log out.';
    startBtn.textContent = 'Start camera';
    startBtn.disabled = false;
    startBtn.onclick = function(){ startCamera(); };
    startCamera();
  }

  function setLive(state, txt){
    liveTag.className = 'live' + (state ? ' ' + state : '');
    liveTxt.textContent = txt;
    frame.classList.toggle('hold', state === 'hold');
  }

  function startCamera(){
    if (running) return;
    if (typeof Html5Qrcode === 'undefined') { camFail('Scanner library failed to load. Check connection.'); return; }
    camOver.hidden = false;
    camMsg.textContent = 'Requesting camera…';
    startBtn.hidden = true;
    if (!qr) qr = new Html5Qrcode('reader', { verbose: false });

    Html5Qrcode.getCameras().then(function (cams) {
      if (!cams || !cams.length) throw new Error('No camera found on this device.');
      var rear = null;
      for (var i = 0; i < cams.length; i++) {
        var l = (cams[i].label || '').toLowerCase();
        if (l.indexOf('back') !== -1 || l.indexOf('rear') !== -1 || l.indexOf('environment') !== -1) { rear = cams[i]; break; }
      }
      return qr.start(rear ? rear.id : cams[cams.length - 1].id,
        { fps: 10, qrbox: { width: 240, height: 240 } }, onDetect, function () {});
    }).then(function () {
      running = true;
      camOver.hidden = true;
      startBtn.hidden = false;
      setLive('on', 'Live — point at a QR');
    }).catch(function (err) {
      camFail(String(err && err.message ? err.message : err));
    });
  }

  function camFail(msg){
    running = false;
    camOver.hidden = false;
    startBtn.hidden = false;
    startBtn.textContent = 'Start camera';
    camMsg.innerHTML = '<span style="color:var(--orange)">' + esc(msg) + '</span> Allow camera for this site in browser settings, then tap Start camera.';
    setLive('', 'Camera off');
  }

  function pauseCamera(){
    if (!qr || !running) return;
    try { qr.pause(true); } catch (e) {}
  }
  function resumeCamera(){
    if (!qr || !running) { startCamera(); return; }
    try { qr.resume(); } catch (e) {}
    cooldownUntil = Date.now() + 1400;
    setLive('on', 'Live — point at a QR');
  }

  function onDetect(txt){
    if (modalOpen || holding) return;
    var now = Date.now();
    if (now < cooldownUntil) return;
    var t = String(txt || '').trim();
    if (!t) return;
    if (t === lastToken && now - lastTokenAt < 8000) return;
    lastToken = t; lastTokenAt = now;
    processCode(t);
  }

  function processCode(val){
    holding = true;
    modalOpen = true;
    pauseCamera();
    setLive('hold', 'Pass held');
    openSheet('<div class="ico">···</div><h2>Reading pass…</h2>', 's-load');
    api({ action: 'checkin', adminKey: staffKey, token: val, ticketId: val })
      .then(function (res) {
        if (res && res.kind === 'forbidden') { teardownToLogin(); return; }
        showResult(res || { ok: false, kind: 'not_found' });
      })
      .catch(function () {
        showResult({ ok: false, kind: 'network' });
      });
  }

  function openSheet(html, cls){
    sheet.className = 'sheet ' + (cls || '');
    sheet.innerHTML = html;
    modal.hidden = false;
  }

  function showResult(r){
    var cls, ico, head, btnLabel;
    if (r.ok && r.kind !== 'already') { cls = 's-ok'; ico = '✓'; head = 'Checked in'; btnLabel = 'Done · scan next'; }
    else if (r.ok && r.kind === 'already') { cls = 's-already'; ico = '✓'; head = 'Already checked in'; btnLabel = 'OK · scan next'; }
    else if (r.kind === 'cancelled') { cls = 's-err'; ico = '✕'; head = 'Cancelled ticket'; btnLabel = 'Close · keep scanning'; }
    else if (r.kind === 'network' || r.kind === 'busy') { cls = 's-err'; ico = '!'; head = 'Connection issue'; btnLabel = 'Close · try again'; }
    else { cls = 's-err'; ico = '?'; head = 'Not found'; btnLabel = 'Close · keep scanning'; }

    var html = '<div class="ico">' + ico + '</div><h2>' + esc(head) + '</h2>';

    if (r.category && (r.ok || r.kind === 'already' || r.kind === 'cancelled')) {
      html += '<div class="badge">' + esc(categoryLabel(r.category)) + '</div>';
    }
    if (r.name) html += '<div class="pname">' + esc(r.name) + '</div>';
    if (r.composition) html += '<p class="psub">' + esc(r.composition) + '</p>';
    if (!r.ok && r.kind === 'not_found') html += '<p class="psub">Please verify the pass and try again.</p>';
    if (r.kind === 'network' || r.kind === 'busy') html += '<p class="psub">The sheet could not be reached. Close and rescan.</p>';
    if (r.kind === 'cancelled') html += '<p class="psub">This pass cannot be used for entry.</p>';

    if (r.party && r.party.length) html += partyHTML(r.party);

    if (r.ok || r.kind === 'already' || r.kind === 'cancelled') {
      html += '<div class="meta">';
      html += metaRow('Ticket', r.ticketId || '');
      html += metaRow(r.party && r.party.length > 1 ? 'Seats' : 'Seat',
                      r.party && r.party.length > 1 ? seatsOf(r.party) : (r.seat || ''));
      html += metaRow('Pass', r.type || '');
      if (r.bookedAt) html += metaRow('Booked', r.bookedAt);
      if (r.checkedInAt) html += metaRow('Time', r.checkedInAt);
      html += '</div>';
    }

    html += '<button class="btn primary" id="closeSheet">' + btnLabel + '</button>';
    openSheet(html, cls);

    document.getElementById('closeSheet').addEventListener('click', closeSheet);
    if (navigator.vibrate && r.ok) navigator.vibrate(40);
  }

  function partyHTML(party){
    var html = '<div class="party"><div class="party-head"><span class="k">Party</span><span class="n">' +
      party.length + ' ' + (party.length === 1 ? 'person' : 'people') + '</span></div>';
    party.forEach(function (m) {
      var rc = String(m.role || 'PRIMARY').toLowerCase();
      var age = (m.age != null && rc === 'child') ? '<span class="age">(age ' + m.age + ')</span>' : '';
      html += '<div class="pm"><span class="nm">' + esc(m.name || '') + age + '</span>' +
              '<span class="rl ' + rc + '">' + esc(m.role || '') + '</span>' +
              '<span class="st">' + esc(m.seat || '') + '</span></div>';
    });
    html += '</div>';
    return html;
  }
  function seatsOf(party){
    return party.map(function (m) { return m.seat || ''; }).filter(Boolean).join(' · ');
  }
  function categoryLabel(c){
    c = String(c || '').toUpperCase();
    if (c === 'FAMILY') return 'Family booking';
    if (c === 'PARTNER') return 'Partner booking';
    return 'Single booking';
  }
  function metaRow(k, v){
    return '<div class="row"><span class="k">' + esc(k) + '</span><span class="v">' + esc(String(v)) + '</span></div>';
  }

  function closeSheet(){
    modal.hidden = true;
    modalOpen = false;
    holding = false;
    resumeCamera();
  }
  modal.addEventListener('click', function (e) { if (e.target === modal) closeSheet(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && modalOpen) closeSheet(); });

  kbBtn.addEventListener('click', function () {
    manualRow.hidden = !manualRow.hidden;
    if (!manualRow.hidden) manualId.focus();
  });
  manualGo.addEventListener('click', submitManual);
  manualId.addEventListener('keydown', function (e) { if (e.key === 'Enter') submitManual(); });
  function submitManual(){
    var v = manualId.value.trim();
    if (!v || modalOpen || holding) return;
    manualId.value = '';
    processCode(v);
  }

  logoutBtn.addEventListener('click', function () { teardownToLogin(); });
  function teardownToLogin(){
    staffKey = '';
    modalOpen = false; holding = false;
    modal.hidden = true;
    if (qr && running) {
      qr.stop().then(function () { running = false; showLoginGate(); }).catch(function () { running = false; showLoginGate(); });
    } else { running = false; showLoginGate(); }
    setLive('', 'Camera off');
  }

  document.addEventListener('visibilitychange', function () {
    if (!running || modalOpen) return;
    if (document.hidden) { try { qr.pause(true); } catch (e) {} }
    else { try { qr.resume(); } catch (e) {} }
  });
  window.addEventListener('beforeunload', function () { staffKey = ''; });

  function api(payload){
    return fetch(EXEC, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    }).then(function (r) { return r.json(); });
  }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }
})();
</script>
</body>
</html>
